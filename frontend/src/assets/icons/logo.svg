<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Letra "W" estilizada -->
  <path d="M30 70 L50 30 L70 50 L90 30 L110 70" 
        stroke="url(#wallex-gradient)" 
        stroke-width="10" 
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none" />
  
  <!-- Texto "Wallex" -->
  <text x="150" y="65" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="#0A2463" 
        text-anchor="middle">Wallex</text>
  
  <!-- Degradado azul-verde -->
  <defs>
    <linearGradient id="wallex-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2962FF"/> <!-- Azul eléctrico -->
      <stop offset="100%" stop-color="#00C853"/> <!-- Verde esmeralda -->
    </linearGradient>
  </defs>
</svg>