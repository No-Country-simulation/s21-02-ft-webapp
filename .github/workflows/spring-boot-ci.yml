name: CI - Maven

on:
  push:
    branches: [ "main" ]
    # Ajusta el path dependiendo si tienes una carpeta backend o no
    paths:
      - 'backend/**'   # Incluye este filtro si el backend está en carpeta separada
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'   # Igual que arriba, ajusta según estructura del proyecto # - '**'
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend   # Cambia a 'backend' si tienes carpeta, o usa '.' para proyecto a nivel raíz

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar
