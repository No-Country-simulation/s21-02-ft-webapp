# ========================
# DATABASE - PostgreSQL Render
# ========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool optimizado
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ========================
# JPA - Producción
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ========================
# EMAIL - Producción
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

# ========================
# ACTUATOR - Producción (seguro)
# ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ========================
# CORS - Producción
# ========================
cors.allowed-origins=${ALLOWED_ORIGINS:https://tu-frontend.onrender.com}

# ========================
# SEGURIDAD - Producción
# ========================
# Compression para mejor performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ========================
# PRODUCTION LOGGING
# ========================

# Logging mínimo y estructurado (JSON para análisis)
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}", "level":"%5p", "thread":"%t", "logger":"%logger", "line":"%L", "message":"%m", "exception":"%wEx"}%n

# Niveles optimizados para producción
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
logging.level.com.wallex=INFO

# Deshabilitar logs detallados
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF

# Log solo errores de conexión DB
logging.level.org.springframework.jdbc=ERROR
logging.level.org.springframework.transaction=ERROR

# Request logging para producción
logging.level.org.springframework.web=INFO
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms) %b "%{Referer}i" "%{User-Agent}i"