# ============================================
# PRODUCCION - Configuracion optimizada
# ============================================

# --- DATABASE (variables REQUERIDAS de .env) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONEXION POOL (optimizado) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# --- JPA/HIBERNATE (produccion) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- EMAIL (produccion) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS (produccion) ---
cors.allowed-origins=${ALLOWED_ORIGINS:https://tu-frontend.onrender.com}

# --- ACTUATOR (solo endpoints esenciales) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ============================================
# LOGGING PRODUCCION (estructurado para monitoreo)
# ============================================
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}", "level":"%5p", "thread":"%t", "logger":"%logger", "message":"%m"}%n

# Niveles optimizados para produccion
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.wallex=INFO
logging.level.org.hibernate.SQL=OFF