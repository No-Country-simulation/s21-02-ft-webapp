# ========================
# CONFIGURACIÓN COMÚN
# ========================
spring.application.name=financial-platform

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Variables externas (se sobrescriben por perfil)
dollar.api.base=${API_BASE:https://dolarapi.com/v1/dolares}
dollar.api.dollar-oficial=${VALUE_DOLLAR_OFICIAL:/oficial}
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}
jwt.secret.key=${JWT_SECRET_KEY}

# ========================
# PERFIL POR DEFECTO: local
# ========================
# Si no se especifica SPRING_PROFILES_ACTIVE, usa 'local'
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Puerto (producción usará PORT de Render, local usará 9091)
server.port=${PORT:8080}


# ========================
# LOGGING CONFIGURATION
# ========================

# Niveles globales
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.com.wallex=DEBUG

# Formato CONSOLA (colorido y legible)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %clr(%L){green} %clr(-){faint} %m%n%wEx

# Formato ARCHIVO (sin colores)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%15.15t] %-40.40logger{39} : %L - %m%n

# Archivo de logs (opcional)
logging.file.name=logs/financial-platform.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=100MB

# Logs específicos para desarrollo
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.web=DEBUG

# Deshabilitar logs innecesarios
logging.level.org.apache=WARN
logging.level.org.thymeleaf=WARN
logging.level.org.eclipse=WARN