# ========================
# DATABASE - PostgreSQL Local
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/financial_platform_db
spring.datasource.username=postgres
spring.datasource.password=${LOCAL_PG_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA - Local
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# EMAIL - Local
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================
# CORS - Local
# ========================
cors.allowed-origins=http://localhost:3000

# ========================
# DESARROLLO - Features
# ========================
# Actuator para desarrollo
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ========================
# ENHANCED LOGGING FOR LOCAL DEVELOPMENT
# ========================
# ========================
# LOGGING - Local (detallado)
# ========================
logging.level.org.hibernate.type=TRACE

# SQL con colores y formato bonito
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging detallado para desarrollo
logging.level.com.wallex=TRACE
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.jdbc=TRACE

# Hibernate SQL logging con colores
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Formato especial para SQL
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %clr(%L){green} %clr(-){faint} %m%n%wEx

# Request/Response logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
