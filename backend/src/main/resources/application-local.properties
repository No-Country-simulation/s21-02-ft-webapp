# ============================================
# DESARROLLO LOCAL - Configuracion detallada
# ============================================

# --- DATABASE LOCAL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/financial_db_local
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/HIBERNATE (DEBUG) ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# --- EMAIL (usa variables de .env) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}cors
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS (frontend local) ---
cors.allowed-origins=http://localhost:5173

# --- ACTUATOR (monitoreo completo) ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================
# LOGGING DETALLADO (solo desarrollo)
# ============================================
logging.level.com.wallex=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Formato consola colorido
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %clr(%L){green} %clr(-){faint} %m%n%wEx